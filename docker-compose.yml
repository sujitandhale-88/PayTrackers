
services:
  mysql:
    image: mysql:8.4
    container_name: paytrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_local_password
      MYSQL_DATABASE: paytrack
      MYSQL_USER: paytrack
      MYSQL_PASSWORD: paytrack_local_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
